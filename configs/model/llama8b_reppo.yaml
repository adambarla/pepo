# REPPO Llama 8B Configuration
# Orchestrates two-phase training: Reward (L models) -> Policy (1 model)
# Note: Policy trainer is currently a placeholder

_target_: pepo.model.reppo.REPPOModel
_recursive_: false

reward_model:
  _target_: pepo.model.reppo.REPPORewardModel
  num_networks: ${L}
  model_id: "allenai/Llama-3.1-Tulu-3-8B-SFT"
  lora_r: 16
  lora_alpha: 16
  lora_dropout: 0.05
  lora_bias: "none"
  lora_task_type: "CAUSAL_LM"
  lora_target_modules: "all-linear"
  compile: false
  debug: ${debug}


# Policy Model Configuration (Main REPPOModel args)
model_id: "allenai/Llama-3.1-Tulu-3-8B-SFT"
lora_r: 16
lora_alpha: 16
lora_dropout: 0.05
lora_bias: "none"
lora_task_type: "CAUSAL_LM"
lora_target_modules: "all-linear"
compile: false
debug: ${debug}
kl_coef: 0.1

generator:
  _target_: pepo.generator.Generator
  batch_size: 128
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 128


