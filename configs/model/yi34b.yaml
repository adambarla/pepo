# SmolLM2 Model Configuration for PEPO
# Note: If L > num_gpus, divide batch_size by ceil(L/num_gpus) and multiply gradient_accumulation_steps by ceil(L/num_gpus)
defaults:
  - /trainer@trainer: default
  - /generator@generator: greedy
  - _self_

_target_: pepo.model.deppo.DEPPOModel
alpha: 0.1
beta: 0.1
num_networks: 8 # placeholder, will be overridden by L
model_id: "01-ai/Yi-34B-Chat"
tokenizer_id: null
chat_template: null # use the provided one
lora_r: 16
lora_alpha: 16
lora_dropout: 0.05
lora_bias: "none"
lora_task_type: "CAUSAL_LM"
lora_target_modules: "all-linear"
compile: false

trainer:
  train_batch_size: 4  # Updated 2025-12-18 by find_optimal_batch_sizes.py
  eval_batch_size: 32  # Updated 2025-12-18 by find_optimal_batch_sizes.py
  gradient_accumulation_steps: 1

generator:
  batch_size: 32  # Updated 2025-12-19
