
defaults:
  - /trainer@reward_model.trainer: ensemble
  - /trainer@trainer: single
  - /generator@generator: greedy
  - _self_

# Shared LLM config (reward + policy use the same base model)
model_id: "alignment-handbook/zephyr-7b-sft-full"
lora_r: 16
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: "all-linear"

train_batch_size: 64
eval_batch_size: 256
generator_batch_size: 128

_target_: pepo.model.reppo.REPPOModel

wandb:
  tags: ["reppo"]

reward_model:
  _target_: pepo.model.reppo.REPPORewardModel
  num_networks: ${L}
  model_id: ${..model_id}
  lora_r: ${..lora_r}
  lora_alpha: ${..lora_alpha}
  lora_dropout: ${..lora_dropout}
  lora_target_modules: ${..lora_target_modules}
  lora_task_type: "FEATURE_EXTRACTION"
  debug: ${..debug}
  trainer:
    train_batch_size: ${...train_batch_size}
    eval_batch_size: ${...eval_batch_size}
    gradient_accumulation_steps: 1
    training_epochs: 2

tokenizer_id: null
chat_template: null
lora_bias: "none"
lora_task_type: "CAUSAL_LM"
compile: false
debug: ${debug}
beta: 0.1
force_annotation: false

trainer:
  train_batch_size: ${..train_batch_size}
  eval_batch_size: ${..eval_batch_size}
  gradient_accumulation_steps: 1
  training_epochs: 2

generator:
  batch_size: ${..generator_batch_size}
