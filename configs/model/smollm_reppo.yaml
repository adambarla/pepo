# SmolLM2 Model Configuration for REPPO
# Orchestrates two-phase training: Reward (L=1 models) -> Policy (1 model)

defaults:
  - /trainer@reward_trainer: ensemble
  - /trainer@policy_trainer: single
  - _self_

_target_: pepo.model.reppo.REPPOModel
_recursive_: false

wandb:
  tags: ["reppo"]

trainer:
  eval_batch_size: 256

reward_model:
  _target_: pepo.model.reppo.REPPORewardModel
  num_networks: ${L}
  model_id: "HuggingFaceTB/SmolLM2-1.7B"
  chat_template: ${pepo.constants:SMOLLM_CHAT_TEMPLATE}
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: "all-linear"
  debug: ${debug}

model_id: "HuggingFaceTB/SmolLM2-1.7B"
tokenizer_id: null
chat_template: ${pepo.constants:SMOLLM_CHAT_TEMPLATE}
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_bias: "none"
lora_task_type: "CAUSAL_LM"
lora_target_modules: "all-linear"
compile: false
debug: ${debug}
kl_coef: 0.1

reward_trainer:
  train_batch_size: 128
  eval_batch_size: 256
  gradient_accumulation_steps: 1
  log_interval: 1
  skip_eval: false
  optimizer:
    lr: 5e-6
  training_epochs: 1

policy_trainer:
  train_batch_size: 128
  eval_batch_size: 256
  gradient_accumulation_steps: 1
  log_interval: 1
  skip_eval: false
  optimizer:
    lr: 1e-6
  training_epochs: 1

generator:
  _target_: pepo.generator.Generator
  batch_size: 256
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 128
