# SmolLM2 Model Configuration for REPPO
# Orchestrates two-phase training: Reward (L=1 models) -> Policy (1 model)

defaults:
  - /trainer@reward_model.trainer: ensemble
  - /trainer@trainer: single
  - _self_

train_batch_size: 128
eval_batch_size: 256

_target_: pepo.model.reppo.REPPOModel

wandb:
  tags: ["reppo"]

reward_model:
  _target_: pepo.model.reppo.REPPORewardModel
  num_networks: ${L}
  model_id: "HuggingFaceTB/SmolLM2-1.7B"
  chat_template: ${pepo.constants:SMOLLM_CHAT_TEMPLATE}
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: "all-linear"
  debug: ${debug}
  trainer:
    train_batch_size: ${...train_batch_size}
    eval_batch_size: ${...eval_batch_size}
    gradient_accumulation_steps: 1
    training_epochs: 1

model_id: "HuggingFaceTB/SmolLM2-1.7B"
tokenizer_id: null
chat_template: ${pepo.constants:SMOLLM_CHAT_TEMPLATE}
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_bias: "none"
lora_task_type: "CAUSAL_LM"
lora_target_modules: "all-linear"
compile: false
debug: ${debug}
kl_coef: 0.1



trainer:
  train_batch_size: ${..train_batch_size}
  eval_batch_size: ${..eval_batch_size}
  gradient_accumulation_steps: 1
  training_epochs: 1

generator:
  _target_: pepo.generator.Generator
  batch_size: 256
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 128
