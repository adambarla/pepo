defaults:
  - /trainer@trainer: single
  - /generator@generator: greedy
  - _self_

_target_: pepo.model.chippo.CHIPPOModel
backbone: ${backbone}
num_networks: 1

wandb:
  tags: ["chippo"]

debug: ${debug}
beta_chi: 0.1
alpha_chi: 1.0
gamma_chi: 1.0
r_max_chi: 10.0

trainer:
  training_epochs: 1

generator:
  batch_size: ${backbone.generator_batch_size}
