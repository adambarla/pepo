# SmolLM2 Model Configuration for PEPO
defaults:
  - /trainer@trainer: default
  - _self_

_target_: pepo.model.PEPOModel
alpha: 0.1
beta: 0.1
num_networks: 8 # placeholder
model_id: "mistralai/Mistral-7B-Instruct-v0.3"
tokenizer_id: null
chat_template: null # use the provided one
lora_r: 16
lora_alpha: 16
lora_dropout: 0.05
lora_bias: "none"
lora_task_type: "CAUSAL_LM"
lora_target_modules: "all-linear"

# Trainer configuration overrides
trainer:
  batch_size: 4
  gradient_accumulation_steps: 1

