# PEPO Ensemble Training Configuration
defaults:
  - model: smollm
  - dataset: ultrafeedback
  - _self_

model:
  num_networks: ${L}
dataset:
  n_splits: ${model.num_networks}
  train_split: 0.99
  eval_split: 0.01
  max_length: 1024
  max_prompt_length: 512
  cache_dir: ${oc.env:SCRATCH}/pepo/cache # cache is $SCRATCH/pepo/cache

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-5
  fused: true

# Learning rate scheduler configuration
scheduler:
  name: cosine
  num_warmup_steps: 0

# Device configuration
device:
  _target_: pepo.utils.device.DeviceManager
  gpu_ids: null  # list of GPU IDs (null = auto-detect), e.g. [0, 1, 2, 3]

# HuggingFace Hub configuration
hub:
  _target_: pepo.utils.hub.HubManager
  base_dir: "PessimisticDPO"  # HuggingFace username/organization
  load: false
  push: true

# Reproducibility
seed: 42

# Logging configuration
logger:
  _target_: pepo.utils.logger.Logger
  name: "train"
  log_file: null
  log_dir: "logs"
  level: ${log_level}
  format_string: null
  date_format: null

# Weights & Biases configuration
wandb:
  _target_: pepo.utils.logger.WandbHandler
  enabled: true
  project: "pepo"
  name: null  # null = auto-generate run name
  tags: []
  notes: null
  entity: "pepo-team"
  mode: "online"  # Options: "online", "offline", "disabled"

log_level: "info"  # Options: "debug", "info", "warning", "error", "critical" (case-insensitive)

L: 4 # Number of submodels in the ensemble
max_epochs: 8
acc_steps: 1 # acc_steps * batch_size should stay constant
batch_size: 8

# Early stopping configuration
early_stopping:
  patience: 1  # Number of epochs to wait before stopping if no improvement. null = disabled
  min_delta: 0.001  # Minimum change to qualify as an improvement

# note: if L>gpus, decrease batch_size to batch_size/(ceil(L/gpus)) and increase acc_steps to ceil(L/gpus)
#   the submodels will be distributed across the GPUs round-robin so they would run out of memory if batch_size is too large
#   batch_size depends on the model size, e.g. for smollm batch_size=8 utilizes ~90% of the GPU memory
#       to get what batch_size is optimal you need to experiment a bit
