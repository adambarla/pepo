# Greedy Sampling Generator Configuration
_target_: pepo.generate.Generator

max_new_tokens: 512
use_ensamble: true
batch_size: 10
greedy_sampling: true
top_p_sampling: false
logger:
  _target_: pepo.utils.logger.Logger
  name: "Generator"
  log_file: ${log_file}
  log_dir: ${log_dir}
  level: ${log_level}
  format_string: null
  date_format: null
