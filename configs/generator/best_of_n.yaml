# Best of N Generator Configuration (Rejection Sampling)
_target_: pepo.generator.BestOfNGenerator

max_prompt_length: 512
max_new_tokens: 1024
greedy_sampling: false
temperature: 1.0
top_p: 0.9
max_trials: 16  # Max attempts per prompt before accepting best candidate

# Target numerator; proposals come from the uniform mixture of members and
# are accepted with probability f_out / mixture (exact, always <= 1):
# - min: f_out = min_π
# - mean_std: f_out = max(0, mean_π - η*std_π), std = population std
sampling_mode: "min"
eta: 1.0  # Std coefficient for mean_std mode
