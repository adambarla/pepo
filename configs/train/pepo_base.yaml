# PEPO Ensemble Training Configuration
# Default parameters for training PEPO ensemble models

# Model configuration
model:
  id: "HuggingFaceTB/SmolLM2-1.7B"
  tokenizer: null  # Will use same as model.id if null

# Dataset configuration
dataset:
  id: "HuggingFaceH4/ultrafeedback_binarized"
  split: "train_sft"

# Training data configuration
# Set to 0 to use full dataset
data:
  num_train_examples: 20
  num_eval_examples: 20

# Training hyperparameters
training:
  epochs: 3
  batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-5
  max_length: 1024
  max_prompt_length: 512

# DPO-specific parameters
pepo:
  beta: 0.1  # DPO beta parameter, controls strength of preference
  alpha: 0.1  # Pessimistic margin alpha

# Ensemble configuration
ensemble:
  num_networks: 3  # Number of networks in the ensemble (L)

# LoRA configuration
lora:
  r: 16
  alpha: 16
  dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules: "all-linear"

# Device configuration
device:
  cuda_index: 0  # GPU index for policy model
  ref_cuda_index: null  # GPU index for reference model (null = auto-assign)
  parallel: false  # Train models in parallel across GPUs
  gpu_ids: null  # Comma-separated GPU IDs (null = auto-detect)

# Output configuration
output:
  base_dir: "PessimisticDPO"  # Base directory for output
  # Output format: {base_dir}/{model_name}dpo_ensemble_with_{alpha}alpha{num_networks}_l{network_id}

# Reproducibility
seed: 42
