# UltraFeedback Binarized Dataset Configuration
_target_: pepo.utils.data.DataManager
dataset_id: "HuggingFaceH4/ultrafeedback_binarized"
split: "train_sft"
train_split: 0.95
eval_split: 0.05
seed: 42
n_splits: null # this has to be set depending on the number of models in the ensemble
max_length: 1024 # Maximum sequence length for responses
max_prompt_length: 512 # Maximum sequence length for prompts
num_proc: null # Number of processes for preprocessing (null = use all available CPUs)
cache_dir: ${oc.env:SCRATCH}/pepo/cache # Directory to cache preprocessed datasets (null = no caching)
force_recompute: false # If true, skip loading from cache and recompute the dataset
# DataLoader configuration for GPU utilization optimization
dataloader_num_workers: 4 # Number of worker processes for data loading
dataloader_pin_memory: true # Pin memory for faster CPU->GPU transfer
dataloader_persistent_workers: true # Keep workers alive between epochs
dataloader_prefetch_factor: 4 # Number of batches to prefetch per worker
