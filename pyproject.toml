[project]
name = "PEPO"
version = "0.1.0"
requires-python = "==3.13.*" # Locks to the Python you used

# Define all your project's dependencies
dependencies = [
    "torch",
    "peft",
    "transformers",
    "accelerate",
    "hydra-core",
    "datasets<4.0.0",
    "python-dotenv",
    "numpy", # To fix that warning
    "jupyter>=1.1.1",
    "wandb>=0.23.0",
    "alpaca-eval>=0.6.6",
    "setuptools<81",
    "bitsandbytes>=0.48.2",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
]

[tool.uv]
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
# This is important! It tells uv to *only* look for
# packages we specify in [tool.uv.sources] here.
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
alpaca-eval = { path = "./alpaca_eval", editable = true }

[dependency-groups]
dev = [
    "detect-secrets",
    "ty>=0.0.11",
    "pytest>=8.4.2",
    "ruff>=0.1.0",
    "pre-commit>=4.3.0",
    "nb-clean>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ty]

[tool.ty.src]
exclude = [
    "alpaca_eval",
    "arena-hard-auto",
    "LLM",
    "figures",
    "notebooks"
]


[tool.ruff]
src = ["src"]
exclude = [
    "figures",
    "notebooks",
    "alpaca_eval",
]

[tool.ruff.lint.isort]
known-first-party = ["pepo"]
